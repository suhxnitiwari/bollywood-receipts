<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="The Guest List: all of Bollywood on one map. Pick any two people and pull the thread between them, every rishta dated and stamped with its receipt.">
<title>The Guest List · Bollywood Receipts</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%2316090A'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' font-weight='700' text-anchor='middle' fill='%23D9B25F'%3EBR%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&family=Mukta:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Caveat:wght@500;700&display=swap">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/world.css">
</head>
<body data-page="web" class="gl">
<canvas id="room" role="img" aria-label="The Guest List: a map of everyone in Bollywood, grouped by family and circle. Use the search panel to connect two people."></canvas>

<div class="gl-left">
<header class="gl-brand">
  <a class="gl-back" href="index.html">← Bollywood Receipts</a>
  <h1>The Guest List</h1>
  <p class="gl-tag">Everyone knows everyone. Pull the thread.</p>
  <p class="gl-meta" id="glmeta"></p>
</header>

<section class="gl-panel gl-ask" aria-labelledby="askh">
  <h2 id="askh">Yeh rishta kya kehlata hai?</h2>
  <form id="askf" autocomplete="off">
    <div class="gl-pair">
      <div class="gl-pick"><label for="pa" class="sr">Person one</label><input id="pa" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="pal" spellcheck="false" placeholder="Aishwarya Rai"><ul id="pal" class="gl-list" role="listbox" hidden></ul></div>
      <button type="button" class="gl-x" id="swap" aria-label="Swap the two people">×</button>
      <div class="gl-pick"><label for="pb" class="sr">Person two</label><input id="pb" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="pbl" spellcheck="false" placeholder="Katrina Kaif"><ul id="pbl" class="gl-list" role="listbox" hidden></ul></div>
    </div>
    <button type="submit" class="gl-go">Pull the thread</button>
    <button type="button" class="gl-ghost" id="setup">Set me up →</button>
  </form>
  <p class="gl-err" id="askerr" role="alert" hidden></p>
</section>
</div>

<section class="gl-panel gl-key" id="key" aria-labelledby="keyh">
  <button type="button" class="gl-fold" id="keyfold" aria-expanded="true" aria-controls="keybody"><h2 id="keyh">Rishta key</h2><span aria-hidden="true">–</span></button>
  <div id="keybody">
    <ul class="gl-legend" id="legend"></ul>
    <p class="gl-sub">Colour the guests by</p>
    <div class="gl-seg" role="group" aria-label="Colour by" data-set="color"><button type="button" data-v="house" aria-pressed="true">Khandaan</button><button type="button" data-v="era" aria-pressed="false">Era</button><button type="button" data-v="none" aria-pressed="false">Plain</button></div>
    <p class="gl-sub">Size by</p>
    <div class="gl-seg" role="group" aria-label="Size by" data-set="size"><button type="button" data-v="gossip" aria-pressed="true">Gossip</button><button type="button" data-v="films" aria-pressed="false">Films</button><button type="button" data-v="equal" aria-pressed="false">Equal</button></div>
    <div class="gl-eras" id="eras" hidden></div>
  </div>
</section>

<nav class="gl-show" aria-label="Show rishtas">
  <span class="gl-show-k">Show me</span>
  <div class="gl-pills" role="group" aria-label="Rishta type">
    <button type="button" data-f="all" aria-pressed="true">All</button><button type="button" data-f="family" aria-pressed="false">Family</button><button type="button" data-f="love" aria-pressed="false">Love</button><button type="button" data-f="friends" aria-pressed="false">Friends</button><button type="button" data-f="feuds" aria-pressed="false">Feuds</button><button type="button" data-f="films" aria-pressed="false">Films</button>
  </div>
  <button type="button" class="gl-verified" id="verified" aria-pressed="false">Receipts only</button>
</nav>

<div class="gl-zoom" role="group" aria-label="Zoom">
  <button type="button" id="zin" aria-label="Zoom in">+</button><button type="button" id="zout" aria-label="Zoom out">−</button><button type="button" id="zfit" aria-label="Show the whole room">⤢</button>
</div>

<div class="gl-cap" id="cap" aria-hidden="true"></div>
<div class="gl-tip" id="tip" hidden></div>
<aside class="gl-panel gl-dossier" id="dossier" aria-live="polite" hidden></aside>
<section class="gl-panel gl-spotted" id="spotted" aria-live="polite" hidden></section>
<section class="gl-drawer" id="drawer" role="dialog" aria-modal="false" aria-labelledby="drawerh" hidden></section>
<button type="button" class="gl-skip" id="skip" hidden>Skip →</button>
<p class="sr" id="say" aria-live="assertive"></p>

<dialog id="rx" aria-label="Receipt"><article class="slip" id="rxin"></article></dialog>
<script src="assets/casefiles.js"></script>
<script src="assets/files.js"></script>
<script src="assets/movies.js"></script>
<script src="assets/site.js"></script>
<script src="assets/world-data.js"></script>
<script src="assets/world.js"></script>
</body>
</html>
