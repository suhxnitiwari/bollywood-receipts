<style>
:root{--ink:#0D0B0C;--paper:#FFF2F4;--muted:#C9B3BA;--rani:#FF1675;--sun:#FF6B1A;--gold:#FFB21A;--sunset:linear-gradient(100deg,#FF1675,#FF4D4D 45%,#FF6B1A 75%,#FFB21A);color-scheme:dark}
html,body{margin:0;height:100%;background:#0D0B0C;color:var(--paper);font-family:"Mukta",system-ui,sans-serif;overflow:hidden}
#g{position:fixed;inset:0}
.hud{position:fixed;left:16px;top:calc(14px + env(safe-area-inset-top,0px));max-width:min(440px,calc(100vw - 32px));z-index:5;pointer-events:none}
.hud>*{pointer-events:auto}
.home{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-decoration:none}
.home:hover{color:#fff}
h1{font-family:"Abril Fatface",Georgia,serif;font-weight:400;font-size:clamp(30px,5vw,52px);line-height:.95;margin:8px 0 6px}
h1 em{font-style:normal;background:var(--sunset);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat{font-size:14px;line-height:1.4;color:#E9D6DC;margin:0 0 10px;background:rgba(13,11,12,.75);border-radius:10px;padding:6px 8px}
.stat b{color:#fff}
.box{background:rgba(13,11,12,.88);backdrop-filter:blur(8px);border:1px solid #3A262D;border-radius:14px;padding:10px 12px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
input{font:inherit;font-size:15px;background:#1A1416;color:#fff;border:1px solid #3A262D;border-radius:999px;padding:7px 12px;min-width:0;flex:1 1 140px}
input:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button{font-family:"IBM Plex Mono",monospace;font-size:12px;border-radius:999px;border:0;padding:8px 13px;cursor:pointer;background:var(--sunset);color:#0D0B0C;font-weight:600}
button.ghost{background:none;color:#fff;border:1px solid #3A262D;font-weight:400}
.lbl{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
#path{font-size:13.5px;line-height:1.45;margin-top:8px;max-height:30vh;overflow:auto}
#path .st{display:block;color:var(--gold);font-family:"IBM Plex Mono",monospace;font-size:11px}
.legend{position:fixed;left:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;flex-wrap:wrap;gap:6px 12px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);max-width:calc(100vw - 32px)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
#card{position:fixed;right:16px;top:calc(14px + env(safe-area-inset-top,0px));width:min(320px,calc(100vw - 32px));max-height:calc(100vh - 100px);overflow:auto;z-index:6}
#card[hidden]{display:none}
#card .ph{width:84px;height:84px;border-radius:50%;object-fit:cover;object-position:50% 15%;border:3px solid #0D0B0C;box-shadow:0 0 0 2px var(--rani)}
#card h2{font-family:"Abril Fatface",Georgia,serif;font-weight:400;font-size:26px;margin:8px 0 2px}
#card ul{list-style:none;margin:8px 0 0;padding:0}
#card li{font-size:13.5px;padding:6px 0;border-top:1px dashed #3A262D;cursor:pointer}
#card li b{color:#fff}#card li span{color:var(--muted);font-size:12px}
#card .x{float:right}
.tip{position:fixed;pointer-events:none;z-index:7}
@media (max-width:640px){#card{top:auto;bottom:calc(52px + env(safe-area-inset-bottom,0px));right:8px;left:8px;width:auto;max-height:42vh}.legend{font-size:9.5px}}
.err{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:20px}
</style>
</head>

  if(n.img){const im=new Image();im.crossOrigin='anonymous';im.onload=()=>{mat.map=circleTex(im);mat.needsUpdate=true};im.src=n.img}
  const lab=new SpriteText(n.id,2.0+Math.min(n.deg,20)*0.07,'#FFF2F4');lab.fontFace='Mukta, sans-serif';lab.fontWeight='700';lab.backgroundColor='rgba(13,11,12,.55)';lab.padding=1.2;lab.borderRadius=2;lab.position.set(0,-(sz/2)-3,0);grp.add(lab);n.__sz=sz;return grp}
let Graph;
try{Graph=ForceGraph3D()(document.getElementById('g')).backgroundColor('#0D0B0C').graphData(DATA).nodeId('id')
  .nodeThreeObject(nodeObj).nodeLabel(n=>`${n.id}, ${n.deg} rishtas`)
  .linkColor(l=>hiL.size?(hiL.has(l)?T[l.t][1]:'#2A1C21'):T[l.t][1]).linkOpacity(.28).linkWidth(l=>hiL.has(l)?1.8:0).cooldownTicks(220).warmupTicks(60)
  .linkDirectionalParticles(l=>hiL.has(l)?3:0).linkDirectionalParticleWidth(1.6).linkDirectionalParticleColor(()=>'#FFB21A')
  .onNodeClick(n=>select(n.id)).onBackgroundClick(()=>{document.getElementById('card').hidden=true});
  Graph.d3Force('charge').strength(-60);Graph.d3Force('link').distance(l=>l.t==='f'||l.t==='m'||l.t==='d'?28:50);
  let fitted=false;Graph.onEngineStop(()=>{if(!fitted){fitted=true;Graph.zoomToFit(1200,30)}});setTimeout(()=>{if(!fitted)Graph.zoomToFit(1200,30)},6000);
}catch(e){document.body.insertAdjacentHTML('beforeend','<div class="err"><p>Your browser can\'t draw the 3D web (WebGL is off). Try Chrome or Safari on a newer device.</p></div>')}
function fly(id,ms=1400){const n=DATA.nodes.find(x=>x.id===id);if(!n||n.x===undefined)return;const dist=70,r=1+dist/Math.hypot(n.x||1,n.y||1,n.z||1);Graph.cameraPosition({x:n.x*r,y:n.y*r,z:n.z*r},n,ms)}
function refresh(){Graph.linkColor(Graph.linkColor()).linkWidth(Graph.linkWidth()).linkDirectionalParticles(Graph.linkDirectionalParticles())}
function select(id){hiN=new Set([id]);hiL=new Set((ADJ[id]||[]).map(x=>x[1]));refresh();fly(id);
  const n=DATA.nodes.find(x=>x.id===id);const rows=(ADJ[id]||[]).map(([o,l])=>[o,l]).sort((p,q)=>(p[1].y||9999)-(q[1].y||9999));
  const c=document.getElementById('card');c.hidden=false;
  c.innerHTML=`<button class="ghost x" type="button" onclick="document.getElementById('card').hidden=true">Close</button>${n.img?`<img class="ph" src="${n.img}" alt="">`:''}<h2>${id}</h2><div class="lbl">${rows.length} rishtas</div><ul>${rows.map(([o,l])=>`<li data-o="${o.replace(/"/g,'&quot;')}"><b>${T[l.t][0]}</b> ${o}${l.y?` <span>${l.y}</span>`:''}${l.d?`<br><span>${l.d}</span>`:''} <span>${VT[l.v]}</span></li>`).join('')}</ul>`;
  c.querySelectorAll('li').forEach(li=>li.onclick=()=>select(li.dataset.o))}
document.getElementById('go').onclick=()=>{const n=resolve(document.getElementById('find').value);if(n){document.getElementById('find').value=n;select(n)}};
document.getElementById('find').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('go').click()});
document.getElementById('cx').onclick=()=>{const a=resolve(document.getElementById('a').value),b=resolve(document.getElementById('b').value),out=document.getElementById('path');
  if(!a||!b){out.textContent='Pick two names from the list, darling.';return}document.getElementById('a').value=a;document.getElementById('b').value=b;
  const p=bfs(a,b);if(!p){out.textContent='No rishta found. Shocking, for Bollywood.';return}
  hiN=new Set([a,...p.map(x=>x[2])]);hiL=new Set(p.map(x=>x[1]));refresh();fly(b,1800);
  out.innerHTML=`<b>${a}</b> to <b>${b}</b>: ${p.length} step${p.length>1?'s':''}.`+p.map(([u,l,v])=>`<span class="st">${T[l.t][0]}${l.y?' '+l.y:''}</span>${v}`).join('')};
document.getElementById('reset').onclick=()=>{hiN.clear();hiL.clear();refresh();document.getElementById('path').textContent='';Graph.zoomToFit(1000,40)};
</script>
