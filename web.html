<style>
:root{--ink:#15110E;--paper:#FBF6EC;--muted:#5E544A;--rani:#C8261C;--sun:#C8261C;--gold:#A8740F;--sunset:#15110E;color-scheme:light}
html,body{margin:0;height:100%;background:#E9DDC7;color:var(--ink);font-family:"Mukta",system-ui,sans-serif;overflow:hidden}
#g{position:fixed;inset:0}
.hud{position:fixed;left:16px;top:calc(14px + env(safe-area-inset-top,0px));max-width:min(440px,calc(100vw - 32px));z-index:5;pointer-events:none}
.hud>*{pointer-events:auto}
.home{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-decoration:none}
.home:hover{color:#fff}
h1{font-family:"Bodoni Moda",Didot,Georgia,serif;text-transform:lowercase;font-weight:400;font-size:clamp(30px,5vw,52px);line-height:.95;margin:8px 0 6px}
h1 em{font-style:italic;color:var(--rani)}
.stat{font-size:14px;line-height:1.4;color:#E9D6DC;margin:0 0 10px;background:rgba(13,11,12,.75);border-radius:10px;padding:6px 8px}
.stat b{color:#fff}
.box{background:rgba(13,11,12,.88);backdrop-filter:blur(8px);border:1px solid #3A262D;border-radius:14px;padding:10px 12px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
input{font:inherit;font-size:15px;background:#1A1416;color:#fff;border:1px solid #3A262D;border-radius:999px;padding:7px 12px;min-width:0;flex:1 1 140px}
input:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button{font-family:"IBM Plex Mono",monospace;font-size:12px;border-radius:999px;border:0;padding:8px 13px;cursor:pointer;background:var(--sunset);color:#0D0B0C;font-weight:600}
button.ghost{background:none;color:#fff;border:1px solid #3A262D;font-weight:400}
.lbl{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
#path{font-size:13.5px;line-height:1.45;margin-top:8px;max-height:30vh;overflow:auto}
#path .st{display:block;color:var(--gold);font-family:"IBM Plex Mono",monospace;font-size:11px}
.legend{position:fixed;left:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;flex-wrap:wrap;gap:6px 12px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);max-width:calc(100vw - 32px)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
#card{position:fixed;right:16px;top:calc(14px + env(safe-area-inset-top,0px));width:min(320px,calc(100vw - 32px));max-height:calc(100vh - 100px);overflow:auto;z-index:6}
#card[hidden]{display:none}
#card .ph{width:84px;height:84px;border-radius:50%;object-fit:cover;object-position:50% 15%;border:3px solid #0D0B0C;box-shadow:0 0 0 2px var(--rani)}
#card h2{font-family:"Bodoni Moda",Didot,Georgia,serif;font-style:italic;font-weight:400;font-size:26px;margin:8px 0 2px}
#card ul{list-style:none;margin:8px 0 0;padding:0}
#card li{font-size:13.5px;padding:6px 0;border-top:1px dashed #3A262D;cursor:pointer}
#card li b{color:#fff}#card li span{color:var(--muted);font-size:12px}
#card .x{float:right}
.tip{position:fixed;pointer-events:none;z-index:7}
@media (max-width:640px){#card{top:auto;bottom:calc(52px + env(safe-area-inset-bottom,0px));right:8px;left:8px;width:auto;max-height:42vh}.legend{font-size:9.5px}}
.err{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:20px}

#g{z-index:0}
.hud,.legend,#card,.blast{z-index:5}
.home{color:var(--ink);font-weight:600}.home:hover{color:var(--rani)}
.kick{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--rani);margin:12px 0 0}
h1{font-family:"Bodoni Moda",Didot,Georgia,serif;font-weight:800;text-transform:uppercase;font-size:clamp(32px,5vw,58px);line-height:.92;letter-spacing:-.01em}
h1 em{color:var(--rani);font-weight:700}
.stat{background:rgba(251,246,236,.92);color:var(--ink);border:1px solid var(--ink);border-radius:0}.stat b{color:var(--rani)}
.box{background:rgba(251,246,236,.95);backdrop-filter:none;border:1.5px solid var(--ink);border-radius:0;box-shadow:6px 6px 0 var(--ink)}
input{background:#fff;color:var(--ink);border:0;border-bottom:2px solid var(--ink);border-radius:0}
button{background:var(--ink);color:#F3EADB;border-radius:0;letter-spacing:.12em;text-transform:uppercase;font-size:11px}
button.ghost{background:none;color:var(--ink);border:1.5px solid var(--ink)}
.lbl{color:var(--rani)}
#path .spot{font-family:"Bodoni Moda",Didot,Georgia,serif;font-weight:700;font-size:17px;line-height:1.2;margin:2px 0 8px}
#path .spot b,.blast b{font-family:"IBM Plex Mono",monospace;font-size:.62em;letter-spacing:.2em;text-transform:uppercase;color:var(--rani);margin-right:4px}
#path .spot i,.blast i{font-family:"Caveat",cursive;font-style:normal;color:var(--rani);font-size:1.25em}
#path .nm{display:block;font-family:"Bodoni Moda",Didot,Georgia,serif;font-weight:700;font-size:15px}
#path .st{color:var(--rani);padding-left:10px;border-left:2px solid var(--rani);margin:2px 0 2px 4px}
#card{border-color:var(--ink)}#card .ph{border-radius:0;border:5px solid #fff;box-shadow:0 6px 12px -6px rgba(21,17,14,.6)}
#card .spotk{color:var(--rani);letter-spacing:.24em;margin:12px 0 0}
#card h2{font-weight:800;font-style:normal;text-transform:uppercase;font-size:28px}
#card li{border-top-color:#D6C8AF}#card li b{color:var(--rani)}#card li span{color:var(--muted)}
.legend{color:var(--ink);background:rgba(251,246,236,.9);padding:6px 10px;border:1px solid var(--ink)}
.blast{position:fixed;left:50%;bottom:calc(52px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);margin:0;max-width:min(680px,calc(100vw - 32px));text-align:center;font:700 clamp(17px,2.2vw,22px)/1.3 "Bodoni Moda",Didot,Georgia,serif;color:var(--ink);background:rgba(251,246,236,.95);border:1.5px solid var(--ink);padding:8px 14px;opacity:0;pointer-events:none;transition:opacity .5s,transform .5s}
.blast.on{opacity:1;transform:translate(-50%,0)}
.xo{position:fixed;right:18px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;font-family:"Caveat",cursive;font-size:32px;color:var(--rani);pointer-events:none}
@media (max-width:640px){.xo{display:none}.blast{bottom:auto;top:calc(50vh - 20px)}}
@media (prefers-reduced-motion:reduce){.blast{transition:none}}
</style>

  blast(`<b>Spotted:</b> ${a} and ${b}, ${p.length===1?'directly linked':p.length+' degrees apart'}.`)};
document.getElementById('reset').onclick=()=>{hiN.clear();hiL.clear();refresh();document.getElementById('path').textContent='';Graph.zoomToFit(1000,40)};
</script>
